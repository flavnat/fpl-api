services:
  - type: web
    name: fpl-api
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL_PROD
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: ENABLE_GRAPHIQL
        value: "true"
      - key: ENABLE_SWAGGER
        value: "true"
      - key: LOG_LEVEL
        value: info
