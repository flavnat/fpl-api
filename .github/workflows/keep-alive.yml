# Keep Alive - Ping health endpoint to prevent Render cold starts
name: Keep Alive

on:
  schedule:
    # Run every 10 minutes to stay under Render's 15-minute sleep timer
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sSf https://fpl-api-6h0d.onrender.com/health || exit 1
          echo "Health check passed at $(date)"
