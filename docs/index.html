<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>FPL API Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentation for FPL API - The modern open source Fantasy Premier League API">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Use a clean specific theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    /* Premium FPL Theme */
    :root {
      --theme-color: #37003c;
      /* PL Purple */
      --text-color: #333;
      --sidebar-width: 300px;
    }

    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    .cover-main h1 {
      color: #37003c;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .cover-main blockquote {
      font-size: 1.2rem;
      color: #666;
    }

    /* Navbar styling */
    .app-nav {
      margin-top: 10px;
    }

    .app-nav li ul {
      width: 120px;
    }

    /* Code blocks */
    pre {
      background-color: #f8f8f8;
      border-radius: 6px;
    }


    /* Remove search input borders and background */
    .sidebar .search .input-wrap {
      border-bottom: none !important;
    }

    .sidebar .search input {
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      background: transparent !important;
    }

    .sidebar .search input:focus,
    .sidebar .search input:hover {
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      background: transparent !important;
    }

    /* Fix Sidebar Scroll */
    .sidebar {
      overflow-y: auto;
      scrollbar-width: thin;
      /* Firefox */
    }

    .sidebar::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar::-webkit-scrollbar-track {
      background: transparent;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 10px;
    }

    .sidebar::-webkit-scrollbar-thumb:hover {
      background: #999;
    }

    .cover-main .cover-description {
      max-width: 980px;
      /* control width */
      margin: auto;
      /* center it */
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-size: 1.2rem;
      line-height: 1.7;
      color: #555;
      font-weight: 400;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'FPL API',
      repo: 'https://github.com/flavnat/fpl-api',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      subMaxLevel: 3,
      auto2top: true,


      // Fix Sidebar Confusion: Alias global usage to v1 sidebar
      alias: {
        '/.*/_navbar.md': '/_navbar.md',
        '/_sidebar.md': '/v1/_sidebar.md',  // Root uses v1 sidebar
        '/v1/.*/_sidebar.md': '/v1/_sidebar.md' // Nested use v1 sidebar
      },

      homepage: 'v1/README.md',

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search Documentation...',
        noData: 'No Results Found',
        depth: 6,
      },

      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>

</html>
